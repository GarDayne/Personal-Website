<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>GALLERY</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			background: linear-gradient(to bottom, #ffccd5, #fff0f3, #ffffff);
			background-attachment: fixed;
			display: flex;
			flex-direction: column;
			align-items: center; 
			overflow-x: hidden;
		}

		.header {
			position: relative;
			width: 100%;
			height: 150px;
			overflow: hidden;
		}

		.header img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			display: block;
		}

		.menu {
			background-color: #ffccd5;
			width: 100%;
			margin: 0;
			padding: 0;
		}

		.head {
			display: flex;
			justify-content: center; 
			align-items: center;
			flex-wrap: wrap;
			gap: 20px;                 
			margin: 0;
			padding: 15px 10px;
			border: 1px solid snow;
			font-family: "Bookman", "URW Bookman L", serif;
			font-weight: bold;
			font-size: clamp(14px, 2vw, 20px);
		}

		.head a {
			color: #73172E;
			text-decoration: none;
			padding: 10px 15px;
			transition: opacity 0.2s;
		}

		.head a:hover {
			opacity: 0.7;
		}

		.wrapper {
			display: flex;
			flex-direction: column;
			align-items: center;
			width: 100%;
			max-width: 1100px;
			padding: 20px;
			box-sizing: border-box;
		}

		.category {
			font-family: 'Courier New', Courier, monospace;
			font-size: clamp(16px, 2.5vw, 22px);
			font-weight: bold;
			letter-spacing: 2px;
			color: whitesmoke;
			margin-top: 40px;
			margin-bottom: 20px;
			padding: 14px 20px;
			background-color: #73172E;
			text-align: center;
			border-radius: 13px;
			width: 100%;
			max-width: 600px;
			box-sizing: border-box;
		}

		.row, .row1 {
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 20px;
			flex-wrap: wrap;
			width: 100%;
		}

		.row img {
			width: 220px;
			max-width: 100%;
			height: 300px;
			border: 2px solid #73172E;
			border-radius: 10px;
			object-fit: cover;
			background-color: mintcream;
			padding: 5px;
			box-sizing: border-box;
		}

		.row1 img {
			width: 300px;
			max-width: 100%;
			height: 300px;
			border: 2px solid #73172E;
			border-radius: 10px;
			object-fit: cover;
			background-color: mintcream;
			padding: 5px;
			box-sizing: border-box;
		}

		.row video {
			width: 100%;
			max-width: 600px;
			height: auto;
			border-radius: 10px;
			border: 2px solid #73172E;
			background-color: mintcream;
			padding: 5px;
			box-sizing: border-box;
		}

		.footer {
			font-family: 'Courier New', Courier, monospace;
			font-size: clamp(14px, 2vw, 20px);
			font-weight: bold;
			letter-spacing: 2px;
			padding: 20px; 
			color: white;
			background-color: #73172E;
			text-align: center;
			margin-top: 60px;
			width: 100%;
			box-sizing: border-box;
		}

		/* Responsive adjustments for smaller mobile screens */
		@media (max-width: 600px) {
			.head {
				gap: 10px;
			}
			.head a {
				padding: 5px 8px;
			}
			.row img, .row1 img {
				width: 100%;
				max-width: 280px;
				height: auto;
			}
		}
	</style>
</head>
<body>

	<div class="header">
		<img src="hey.png" alt="banner">
	</div>

	<div class="menu">
		<div class="head">
			<a href="index.html"> 〢🏠︎ HOME</a>
			<a href="2.html"> 〢˚˖𓍢ִ໋❀ ABOUT ME</a>
			<a href="3.html"> 〢⿻ PORTFOLIO</a>
			<a href="4.html"> 〢『 GALLERY 』</a>
			<a href="5.html"> 〢˗ˏˋ ꒰ ✉︎ CONTACT</a>		
		</div>
	</div>

	<div class="wrapper">

		<!-- 1. SOLO PICTURES -->
		<div class="category">SOLO PICTURES</div>
		<div class="row">
			<img src="13.jfif" alt="img 1">
			<img src="12.jfif" alt="img 2">
			<img src="11.jfif" alt="img 3">
			<img src="14.jpg" alt="img 4">
			<img src="15.jpg" alt="img 5">
			<img src="16.jpg" alt="img 6">
			<img src="muscle.jpg" alt="img 7">
		</div>

		<!-- 2. GROUP PICTURES -->
		<div class="category">GROUP PICTURES</div>
		<div class="row1">
			<img src="20.png" alt="img 1">
			<img src="22.jpg" alt="img 3">
			<img src="23.png" alt="img 4">
		</div>

		<!-- 3. VIDEO -->
		<div class="category">VIDEO</div>
		<div class="row">
			<video src="vlog.mp4" controls>MINI VLOG</video>
		</div>

	</div>

	<div class="footer">
		Dayne Rose B. Tolentino / CS Student
	</div>

</body>
</html>
